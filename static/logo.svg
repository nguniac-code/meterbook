  <!-- dial -->
  <path d="M14 38 A18 18 0 0 1 50 38" fill="none" stroke="#f3efe7" stroke-width="2.4" stroke-linecap="round"/>
  <g stroke="#f3efe7" stroke-width="1.7" stroke-linecap="round">
    <line x1="14" y1="38" x2="19" y2="38"/>
    <line x1="16.4" y1="29" x2="20.7" y2="31.5"/>
    <line x1="23" y1="22.4" x2="25.5" y2="26.7"/>
    <line x1="32" y1="20" x2="32" y2="25"/>
    <line x1="41" y1="22.4" x2="38.5" y2="26.7"/>
