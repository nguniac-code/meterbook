<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sign in · Meterbook</title>
  <link rel="icon" type="image/svg+xml" href="{{ url_for('static', filename='logo.svg') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css', v='2') }}">
</head>
<body class="login-page">
  <main class="login-shell">
    <a class="brand login-brand" href="{{ url_for('login') }}" aria-label="Meterbook sign in">
      <img src="{{ url_for('static', filename='logo.svg') }}" alt="">
      <span class="name">Meterbook<span class="tag">field readings</span></span>
    </a>

    <form class="card login-card" method="post" autocomplete="on">
      <h1>Welcome back</h1>
      <p class="lede">Sign in to continue to Meterbook.</p>

      {% with messages = get_flashed_messages(with_categories=true) %}
        {% for category, text in messages %}
          <div class="msg {{ category }}" role="alert">{{ text }}</div>
        {% endfor %}
      {% endwith %}

      <label for="username">Username</label>
      <input id="username" name="username" type="text" autocomplete="username" required autofocus>

      <label for="password">Password</label>
      <input id="password" name="password" type="password" autocomplete="current-password" required>

      <button type="submit">Sign in</button>
    </form>
  </main>
</body>
</html>
